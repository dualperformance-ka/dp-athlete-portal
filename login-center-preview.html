<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login centering preview</title>
<!-- Uses the real stylesheet so this reflects the actual edit in styles.css -->
<link rel="stylesheet" href="styles.css">
<style>
  /* This preview only forces the (normally JS-toggled) login screen visible.
     It changes nothing about layout — the centering comes from styles.css. */
  #loginScreen{display:block !important}
  body{margin:0}
</style>
</head>
<body class="">
  <!-- LOGIN (markup mirrors index.html) -->
  <div id="loginScreen">
    <div class="login-depth"></div>
    <div class="login-grid"></div>
    <div class="login-wordmark" role="img" aria-label="Dual Performance"></div>
    <div class="login-col" id="loginCard">
      <div class="login-mark-wrap">
        <div class="login-logo-img" role="img" aria-label="Dual Performance"></div>
      </div>
      <div class="login-eyebrow">Dual Performance</div>
      <div class="login-brand">Athlete Portal</div>
      <div class="login-subcopy">Your training, nutrition and check-ins in one place.</div>
      <div id="codeLogin">
        <div class="code-label">Access Code</div>
        <div class="code-boxes" id="codeBoxes" aria-hidden="true">
          <div class="code-box"></div><div class="code-box"></div><div class="code-box"></div>
          <div class="code-box"></div><div class="code-box"></div><div class="code-box"></div>
        </div>
        <div class="login-actions">
          <button class="lbtn" id="loginBtn" disabled>Enter Portal</button>
        </div>
        <div class="login-note">Coach-issued code required</div>
      </div>
      <button type="button" class="email-link login-alt-toggle">Sign in with email instead</button>
    </div>
    <div class="login-footer">Dual Performance Coaching System</div>
  </div>
</body>
</html>
