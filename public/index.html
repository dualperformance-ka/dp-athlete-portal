<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dual Performance — Training Portal</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f9f9f8;--surface:#fff;--surface2:#f2f2f0;--border:rgba(0,0,0,0.08);--border-mid:rgba(0,0,0,0.14);--border-strong:rgba(0,0,0,0.22);--text:#0a0a0a;--muted:#5a5a5a;--dim:#aaa;--run:#b45309;--strength:#1e3a8a;--rest:#6b7280;--ok:#166534;--ok-bg:#f0fdf4;--mono:'DM Mono',monospace;--display:'Barlow Condensed',sans-serif;--body:'Barlow',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.6;min-height:100vh}
header{background:#0a0a0a;padding:0 20px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.hl{display:flex;align-items:center;gap:12px}
.logo{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;line-height:1}
.logo .d{color:#fff}.logo .p{color:#5a5a5a}
.apill{font-family:var(--mono);font-size:10px;color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.15);padding:4px 10px;border-radius:20px}
.week-nav{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:64px;z-index:90}
.wl{font-family:var(--display);font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em}
.nav-row{display:flex;align-items:center;gap:8px}
.arr{font-family:var(--mono);font-size:13px;padding:6px 12px;border:1px solid var(--border-mid);border-radius:4px;background:transparent;color:var(--muted);cursor:pointer}
.arr:hover{color:var(--text);border-color:var(--border-strong)}
.tbtn{font-family:var(--mono);font-size:10px;padding:5px 10px;border:1px solid var(--border-mid);border-radius:4px;background:transparent;color:var(--muted);cursor:pointer;text-transform:uppercase;letter-spacing:0.05em}
.pbar-wrap{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px}
.pbar-row{display:flex;align-items:center;gap:10px}
.pbar{flex:1;height:4px;background:var(--border-mid);border-radius:2px;overflow:hidden}
.pfill{height:100%;background:#0a0a0a;border-radius:2px;transition:width 0.4s}
.plbl{font-family:var(--mono);font-size:10px;color:var(--dim);white-space:nowrap}
.main{max-width:680px;margin:0 auto;padding:16px 16px 80px}
.loading{text-align:center;padding:60px 20px}
.ldots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.ldot{width:7px;height:7px;border-radius:50%;background:#0a0a0a;animation:blink 1.2s infinite}
.ldot:nth-child(2){animation-delay:0.2s}.ldot:nth-child(3){animation-delay:0.4s}
@keyframes blink{0%,100%{opacity:0.15}50%{opacity:1}}
.ltxt{font-family:var(--mono);font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:0.08em}
.noplan{text-align:center;padding:60px 20px;font-family:var(--mono);font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:0.06em;line-height:1.8}
.day-group{margin-bottom:4px}
.dgh{display:flex;align-items:center;gap:10px;padding:12px 2px 8px;border-bottom:2px solid var(--border)}
.dgh.today{border-bottom-color:#0a0a0a}
.dgname{font-family:var(--display);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;min-width:48px}
.dgdate{font-family:var(--mono);font-size:11px;color:var(--dim)}
.today-tag{font-family:var(--mono);font-size:9px;background:#0a0a0a;color:#fff;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.06em;margin-left:auto}
.rest{font-family:var(--mono);font-size:11px;color:var(--dim);padding:10px 2px;text-transform:uppercase;letter-spacing:0.06em}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:6px}
.sc.done{border-color:var(--ok);background:var(--ok-bg)}
.sch{padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
.sch:active{background:var(--surface2)}
.scdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot-run{background:var(--run)}.dot-strength{background:var(--strength)}.dot-rest{background:var(--rest)}
.sci{flex:1;min-width:0}
.scname{font-family:var(--display);font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:0.02em;line-height:1.1}
.scname.run{color:var(--run)}.scname.strength{color:var(--strength)}.scname.rest{color:var(--rest)}
.scsub{font-size:12px;color:var(--muted);margin-top:2px}
.tick{width:38px;height:38px;border-radius:50%;border:2px solid var(--border-mid);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tick.on{background:var(--ok);border-color:var(--ok)}
.tick svg{opacity:0;transition:opacity 0.15s}
.tick.on svg{opacity:1}
.scb{padding:0 16px 16px;display:none}
.scb.open{display:block}
.cnote{background:var(--surface2);border-left:3px solid var(--border-mid);border-radius:0 6px 6px 0;padding:10px 12px;margin-bottom:14px;font-size:13px;color:var(--muted);font-style:italic;line-height:1.5}
.rtarget{background:rgba(180,83,9,0.05);border:1px solid rgba(180,83,9,0.15);border-radius:10px;padding:14px;margin-bottom:14px}
.rtn{font-family:var(--display);font-size:17px;font-weight:700;text-transform:uppercase;color:var(--run);margin-bottom:4px}
.rtd{font-size:13px;color:var(--run);line-height:1.55;margin-bottom:8px;opacity:0.85}
.rtt{display:flex;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;color:var(--run);opacity:0.6}
.ltitle{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--dim);margin-bottom:10px;margin-top:4px}
.rlog{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.lf{display:flex;flex-direction:column;gap:4px}
.lf label{font-family:var(--mono);font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:0.06em}
.li{width:100%;background:var(--surface2);border:1px solid var(--border-mid);border-radius:8px;padding:11px 12px;color:var(--text);font-family:var(--mono);font-size:14px;outline:none;-webkit-appearance:none}
.li:focus{border-color:var(--border-strong);background:var(--surface)}
.exlist{display:grid;gap:8px;margin-bottom:12px}
.exc{background:var(--surface2);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.exh{padding:12px 14px}
.exn{font-family:var(--display);font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:0.02em;line-height:1.2}
.exm{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:2px}
.exw{font-family:var(--mono);font-size:9px;color:var(--run);margin-top:2px}
.slbls{display:grid;grid-template-columns:26px 1fr 1fr 34px;gap:6px;padding:0 14px 4px}
.slbl{font-family:var(--mono);font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:0.05em;text-align:center}
.exsets{padding:0 14px 8px;display:grid;gap:6px}
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 34px;gap:6px;align-items:center}
.snum{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:center}
.si{width:100%;background:var(--surface);border:1px solid var(--border-mid);border-radius:6px;padding:10px 6px;font-family:var(--mono);font-size:14px;font-weight:500;outline:none;text-align:center;-webkit-appearance:none}
.si:focus{border-color:var(--border-strong)}
.st{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border-mid);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;margin:0 auto;flex-shrink:0}
.st.on{background:var(--ok);border-color:var(--ok)}
.st.on svg{opacity:1}
.st svg{opacity:0}
.addset{width:calc(100% - 28px);margin:0 14px 10px;padding:8px;font-family:var(--mono);font-size:10px;color:var(--dim);border:1px dashed var(--border-mid);border-radius:6px;background:transparent;cursor:pointer;text-align:center;text-transform:uppercase;letter-spacing:0.04em}
.savebtn{width:100%;padding:13px;background:#0a0a0a;color:#fff;border:none;border-radius:8px;font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;cursor:pointer;margin-top:8px}
.savebtn.saved{background:var(--ok)}
.login-wrap{max-width:380px;margin:80px auto;padding:0 20px}
.login-logo{text-align:center;margin-bottom:28px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px}
.lt{font-family:var(--display);font-size:30px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:6px}
.ls{font-size:14px;color:var(--muted);margin-bottom:20px;line-height:1.5}
.cinput{width:100%;background:var(--surface2);border:1px solid var(--border-mid);border-radius:8px;padding:14px;color:var(--text);font-family:var(--mono);font-size:20px;outline:none;text-transform:uppercase;letter-spacing:0.12em;text-align:center;margin-bottom:10px;-webkit-appearance:none}
.cinput:focus{border-color:var(--border-strong);background:var(--surface)}
.lbtn{width:100%;padding:14px;background:#0a0a0a;color:#fff;border:none;border-radius:8px;font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;cursor:pointer}
.lerr{font-family:var(--mono);font-size:12px;color:#b91c1c;margin-top:8px;text-align:center;display:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0a0a0a;color:#fff;font-family:var(--mono);font-size:12px;padding:10px 20px;border-radius:20px;display:none;z-index:200;white-space:nowrap}
@media(max-width:400px){.logo{font-size:20px}.scname{font-size:16px}.rlog{grid-template-columns:1fr}}
</style>
</head>

}

  var day=d.getDay(), diff=day===0?-6:1-day;
  return new Date(d.getFullYear(),d.getMonth(),d.getDate()+diff);
}
function getWS(){
  var m=getMon(new Date());
  m.setDate(m.getDate()+weekOffset*7);
  return m;
}
async function api(endpoint,body){
  try{
    var r=await fetch('/api/notion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint,body})});
    if(!r.ok)return null;
    return r.json();
  }catch(e){return null;}
}
function login(){
  var code=(document.getElementById('codeInput').value||'').toUpperCase().trim();
  if(code)doLogin(code);
}
async function doLogin(code){
  var btn=document.getElementById('lbtn');
  btn.textContent='Loading...';btn.disabled=true;
  document.getElementById('lerr').style.display='none';
  var data=await api('databases/'+ATHLETE_DB+'/query',{filter:{property:'Code',rich_text:{equals:code}},page_size:5});
  btn.textContent='Enter portal';btn.disabled=false;
  if(!data||!data.results||!data.results.length){
    document.getElementById('lerr').style.display='block';return;
  }
  var p=data.results[0], props=p.properties;
  athlete={
    id:p.id, notionPageId:p.id,
    name:(props['Athlete']&&props['Athlete'].title&&props['Athlete'].title[0]&&props['Athlete'].title[0].text.content)||
         (props['Name']&&props['Name'].title&&props['Name'].title[0]&&props['Name'].title[0].text.content)||'Athlete',
    code:code
  };
  ticked=JSON.parse(localStorage.getItem('dp_ticked_'+code)||'{}');
  logs=JSON.parse(localStorage.getItem('dp_logs_'+code)||'{}');
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('portalScreen').style.display='block';
  document.getElementById('apill').textContent=athlete.name;
  loadWeek();
}
function shiftWeek(d){weekOffset+=d;loadWeek();}
function goToday(){weekOffset=0;loadWeek();}
async function loadWeek(){
  var ws=getWS();
  var we=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+6);
  var wsISO=localISO(ws), weISO=localISO(we);
  document.getElementById('wl').textContent=
    ws.toLocaleDateString('en-AU',{day:'numeric',month:'short'})+' \u2013 '+
    we.toLocaleDateString('en-AU',{day:'numeric',month:'short'});
  document.getElementById('loadingEl').style.display='block';
  document.getElementById('calEl').style.display='none';
  document.getElementById('noplanEl').style.display='none';
  var data=await api('databases/'+CALENDAR_DB+'/query',{
    filter:{property:'Athlete',relation:{contains:athlete.notionPageId}},
    sorts:[{property:'Planned Date',direction:'ascending'}],
    page_size:100
  });
  document.getElementById('loadingEl').style.display='none';
  if(!data||!data.results){document.getElementById('noplanEl').style.display='block';updateProgress([]);return;}
  var all=data.results.map(function(p){
    var pr=p.properties;
    return {
      id:p.id,
      name:(pr['Name']&&pr['Name'].title&&pr['Name'].title[0]&&pr['Name'].title[0].text.content)||'Session',
      date:(pr['Planned Date']&&pr['Planned Date'].date&&pr['Planned Date'].date.start)||'',
      sessionType:(pr['Session Type']&&pr['Session Type'].select&&pr['Session Type'].select.name)||'',
      status:(pr['Status']&&(pr['Status'].status||pr['Status'].select)&&((pr['Status'].status||pr['Status'].select).name))||'Planned',
      runDetails:(pr['Run Details']&&pr['Run Details'].rich_text&&pr['Run Details'].rich_text[0]&&pr['Run Details'].rich_text[0].text.content)||'',
      intensity:(pr['Intensity']&&pr['Intensity'].select&&pr['Intensity'].select.name)||'',
      week:(pr['Week']&&pr['Week'].select&&pr['Week'].select.name)||'',
      splitName:(pr['Workout Splits']&&pr['Workout Splits'].relation&&pr['Workout Splits'].relation[0]&&pr['Workout Splits'].relation[0].name)||''
    };
  });
  sessions=all.filter(function(s){return s.date&&s.date>=wsISO&&s.date<=weISO;});
  if(!sessions.length){document.getElementById('noplanEl').style.display='block';updateProgress([]);return;}
  renderCalendar(ws);
}
function getType(s){
  var t=(s.sessionType||'').toLowerCase(), n=(s.name||'').toLowerCase();
  if(t==='strength'||n.indexOf('upper')>=0||n.indexOf('lower')>=0)return 'strength';
  if(t==='rest'||t==='recovery'||n.indexOf('rest')>=0)return 'rest';
  return 'run';
}
function esc(str){return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function renderCalendar(ws){
  var todayISO=localISO(new Date()), el=document.getElementById('calEl'), html='';
  for(var di=0;di<7;di++){
    var d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+di);
    var iso=localISO(d), isToday=iso===todayISO;
    var dayLabel=d.toLocaleDateString('en-AU',{day:'numeric',month:'short'});
    var daySessions=sessions.filter(function(s){return s.date===iso;});
    html+='<div class="day-group">';
    html+='<div class="dgh'+(isToday?' today':'')+'"><span class="dgname">'+DAYS[di]+'</span><span class="dgdate">'+dayLabel+'</span>'+(isToday?'<span class="today-tag">Today</span>':'')+'</div>';
    if(!daySessions.length){
      html+='<div class="rest">Rest</div>';
    } else {
      daySessions.forEach(function(s){
        var i=sessions.indexOf(s), type=getType(s), done=ticked[s.id]||s.status==='Completed';
        html+='<div class="sc'+(done?' done':'')+'" id="sc_'+i+'">';
        html+='<div class="sch" onclick="togS('+i+')">';
        html+='<div class="scdot dot-'+type+'"></div>';
        html+='<div class="sci"><div class="scname '+type+'">'+esc(s.name)+'</div>';
        if(s.intensity)html+='<div class="scsub">'+esc(s.intensity)+(s.week?' &middot; '+esc(s.week):'')+'</div>';
        html+='</div>';
        html+='<button class="tick'+(done?' on':'')+'" id="tick_'+i+'" onclick="event.stopPropagation();tickS('+i+')">';
        html+='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
        html+='</button></div>';
        html+='<div class="scb" id="scb_'+i+'">'+renderBody(s,i,type)+'</div>';
        html+='</div>';
      });
    }
    html+='</div>';
  }
  el.innerHTML=html; el.style.display='block';
  updateProgress(sessions);
}
function renderBody(s,i,type){
  var h='';
  if(s.runDetails)h+='<div class="cnote">'+esc(s.runDetails)+'</div>';
  if(type==='run'){
    var rs=RUN[s.name]||null;
    if(rs){
      h+='<div class="rtarget">';
      h+='<div class="rtn">'+esc(rs.name)+'</div>';
      h+='<div class="rtd">'+esc(rs.description)+'</div>';
      h+='<div class="rtt">'+(rs.type?'<span>'+esc(rs.type)+'</span>':'')+(rs.intensity?' <span>&middot; '+esc(rs.intensity)+'</span>':'')+(rs.surface?' <span>&middot; '+esc(rs.surface)+'</span>':'')+(rs.difficulty?' <span>&middot; '+esc(rs.difficulty)+'</span>':'')+'</div>';
      h+='</div>';
    }
    var sl=logs[s.id]||{};
    h+='<div class="ltitle">Log your run</div>';
    h+='<div class="rlog">';
    h+='<div class="lf"><label>Distance (km)</label><input type="number" class="li" id="rd_'+i+'" step="0.1" placeholder="0.0" value="'+(sl.distance||'')+'" /></div>';
    h+='<div class="lf"><label>Actual pace</label><input type="text" class="li" id="rp_'+i+'" placeholder="5:30 /km" value="'+(sl.pace||'')+'" /></div>';
    h+='<div class="lf"><label>RPE</label><select class="li" id="rr_'+i+'"><option value="">...</option>';
    for(var n=1;n<=10;n++)h+='<option value="'+n+'"'+(sl.rpe==n?' selected':'')+'>'+n+'/10</option>';
    h+='</select></div>';
    h+='<div class="lf"><label>How it felt</label><select class="li" id="rf_'+i+'"><option value="">...</option>';
    ['Great \u2014 felt easy','Good \u2014 solid session','Average \u2014 got through it','Tough \u2014 struggled','Bad \u2014 cut it short'].forEach(function(f){
      h+='<option'+(sl.feel===f?' selected':'')+'>'+f+'</option>';
    });
    h+='</select></div></div>';
    h+='<div class="lf" style="margin-bottom:10px"><label>Notes</label><input type="text" class="li" id="rn_'+i+'" placeholder="Anything to flag..." value="'+(sl.notes||'')+'" /></div>';
    h+='<button class="savebtn" id="sb_'+i+'" onclick="saveRun('+i+')">Save run</button>';
  } else if(type==='strength'){
    var splitKey=GYM_KEYS.find(function(k){return s.name.indexOf(k)>=0;})||s.splitName||'Upper A';
    var exercises=STR[splitKey]||[], sl2=logs[s.id]||{};
    if(exercises.length){
      h+='<div class="ltitle">Log your sets</div><div class="exlist">';
      exercises.forEach(function(ex,ei){
        var savedEx=sl2[ex.exercise]||[], sets=parseInt(ex.sets)||2;
        h+='<div class="exc"><div class="exh">';
        h+='<div class="exn">'+esc(ex.exercise)+'</div>';
        h+='<div class="exm">'+esc(ex.sets)+' &times; '+esc(ex.reps)+(ex.rest?' &middot; '+esc(ex.rest)+' rest':'')+'</div>';
        if(ex.notes)h+='<div class="exw">'+esc(ex.notes)+'</div>';
        h+='</div><div class="slbls"><div class="slbl"></div><div class="slbl">kg</div><div class="slbl">reps</div><div class="slbl">&#10003;</div></div>';
        h+='<div class="exsets" id="sets_'+i+'_'+ei+'">';
        for(var si=0;si<sets;si++){
          var sv=savedEx[si]||{};
          h+='<div class="setrow" id="sr_'+i+'_'+ei+'_'+si+'">';
          h+='<div class="snum">'+(si+1)+'</div>';
          h+='<input type="number" class="si" id="w_'+i+'_'+ei+'_'+si+'" placeholder="&mdash;" min="0" step="0.5" value="'+(sv.weight||'')+'" />';
          h+='<input type="number" class="si" id="r_'+i+'_'+ei+'_'+si+'" placeholder="'+esc(ex.reps)+'" min="0" value="'+(sv.reps||'')+'" />';
          h+='<button class="st'+(sv.done?' on':'')+'" id="st_'+i+'_'+ei+'_'+si+'" onclick="togSet('+i+','+ei+','+si+')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></button>';
          h+='</div>';
        }
        h+='</div>';
        h+='<button class="addset" onclick="addSet('+i+','+ei+',\''+esc(ex.reps)+'\')">+ Add set</button>';
        h+='</div>';
      });
      h+='</div>';
    }
    h+='<button class="savebtn" id="sb_'+i+'" onclick="saveGym('+i+',\''+esc(splitKey)+'\')">Save session</button>';
  } else {
    h+='<div style="font-family:var(--mono);font-size:12px;color:var(--dim);padding:4px 0">Rest up. Recovery is training too.</div>';
  }
  return h;
}
function togS(i){document.getElementById('scb_'+i).classList.toggle('open');}
async function tickS(i){
  var s=sessions[i], done=!ticked[s.id];
  ticked[s.id]=done;
  localStorage.setItem('dp_ticked_'+athlete.code,JSON.stringify(ticked));
  document.getElementById('sc_'+i).classList.toggle('done',done);
  var btn=document.getElementById('tick_'+i);
  btn.classList.toggle('on',done);
  btn.querySelector('svg').style.opacity=done?1:0;
  updateProgress(sessions);
  api('pages/'+s.id,{properties:{Status:{select:{name:done?'Completed':'Planned'}}}});
}
function togSet(i,ei,si){
  var btn=document.getElementById('st_'+i+'_'+ei+'_'+si), on=!btn.classList.contains('on');
  btn.classList.toggle('on',on);
  btn.querySelector('svg').style.opacity=on?1:0;
  btn.style.background=on?'var(--ok)':'transparent';
  btn.style.borderColor=on?'var(--ok)':'var(--border-mid)';
}
function addSet(i,ei,rep){
  var c=document.getElementById('sets_'+i+'_'+ei), si=c.querySelectorAll('.setrow').length;
  var row=document.createElement('div'); row.className='setrow'; row.id='sr_'+i+'_'+ei+'_'+si;
  row.innerHTML='<div class="snum">'+(si+1)+'</div><input type="number" class="si" id="w_'+i+'_'+ei+'_'+si+'" placeholder="&mdash;" min="0" step="0.5" /><input type="number" class="si" id="r_'+i+'_'+ei+'_'+si+'" placeholder="'+rep+'" min="0" /><button class="st" id="st_'+i+'_'+ei+'_'+si+'" onclick="togSet('+i+','+ei+','+si+')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></button>';
  c.appendChild(row);
}
async function saveRun(i){
  var s=sessions[i];
  var d={distance:document.getElementById('rd_'+i).value||'',pace:document.getElementById('rp_'+i).value||'',rpe:document.getElementById('rr_'+i).value||'',feel:document.getElementById('rf_'+i).value||'',notes:document.getElementById('rn_'+i).value||''};
  logs[s.id]=d; localStorage.setItem('dp_logs_'+athlete.code,JSON.stringify(logs));
  await api('pages',{parent:{database_id:PERF_DB},properties:{
    'Name':{title:[{text:{content:athlete.name+' \u2014 '+s.name+' \u2014 '+s.date}}]},
    'Athlete':{rich_text:[{text:{content:athlete.name}}]},
    'Date':{date:{start:s.date}},
    'Exercise':{rich_text:[{text:{content:s.name}}]},
    'Sets':{rich_text:[{text:{content:'Dist:'+d.distance+'km Pace:'+d.pace+' RPE:'+d.rpe+' Feel:'+d.feel}}]},
    'S1 Weight':{rich_text:[{text:{content:d.notes||''}}]}
  }});
  showToast('Run saved \u2713');
  var btn=document.getElementById('sb_'+i);
  if(btn){btn.classList.add('saved');btn.textContent='Saved \u2713';setTimeout(function(){btn.classList.remove('saved');btn.textContent='Save run';},2500);}
}
async function saveGym(i,splitKey){
  var s=sessions[i], exercises=STR[splitKey]||[], log={};
  exercises.forEach(function(ex,ei){
    var sets=[], c=document.getElementById('sets_'+i+'_'+ei); if(!c)return;
    c.querySelectorAll('.setrow').forEach(function(_,si){
      var w=document.getElementById('w_'+i+'_'+ei+'_'+si).value||'';
      var r=document.getElementById('r_'+i+'_'+ei+'_'+si).value||'';
      var done=document.getElementById('st_'+i+'_'+ei+'_'+si).classList.contains('on');
      if(w||r||done)sets.push({weight:w,reps:r,done:done});
    });
    if(sets.length)log[ex.exercise]=sets;
  });
  logs[s.id]=log; localStorage.setItem('dp_logs_'+athlete.code,JSON.stringify(logs));
  for(var exName in log){
    var sets=log[exName], s1=sets[0]||{}, s2=sets[1]||{}, s3=sets[2]||{}, s4=sets[3]||{};
    await api('pages',{parent:{database_id:PERF_DB},properties:{
      'Name':{title:[{text:{content:athlete.name+' \u2014 '+exName+' \u2014 '+s.date}}]},
      'Athlete':{rich_text:[{text:{content:athlete.name}}]},
      'Date':{date:{start:s.date}},
      'Exercise':{rich_text:[{text:{content:exName}}]},
      'Sets':{number:sets.length},
      'S1 Weight':{rich_text:[{text:{content:s1.weight||''}}]},
      'S1 Reps':{rich_text:[{text:{content:s1.reps||''}}]},
      'S2 Weight':{rich_text:[{text:{content:s2.weight||''}}]},
      'S2 Reps':{rich_text:[{text:{content:s2.reps||''}}]},
      'S3 Weight':{rich_text:[{text:{content:s3.weight||''}}]},
      'S3 Reps':{rich_text:[{text:{content:s3.reps||''}}]},
      'S4 Weight':{rich_text:[{text:{content:s4.weight||''}}]},
      'S4 Reps':{rich_text:[{text:{content:s4.reps||''}}]}
    }});
  }
  showToast('Session saved \u2713');
  var btn=document.getElementById('sb_'+i);
  if(btn){btn.classList.add('saved');btn.textContent='Saved \u2713';setTimeout(function(){btn.classList.remove('saved');btn.textContent='Save session';},2500);}
}
function updateProgress(ss){
  var total=ss.length, done=ss.filter(function(s){return ticked[s.id]||s.status==='Completed';}).length;
  document.getElementById('pfill').style.width=(total?Math.round(done/total*100):0)+'%';
  document.getElementById('plbl').textContent=done+' / '+total+' done';
}
function showToast(msg){
  var t=document.getElementById('toast'); t.textContent=msg; t.style.display='block';
  setTimeout(function(){t.style.display='none';},2500);
}
var urlCode=new URLSearchParams(location.search).get('code');
if(urlCode)doLogin(urlCode);
else document.getElementById('loginScreen').style.display='block';

</script>
</body>
</html>
