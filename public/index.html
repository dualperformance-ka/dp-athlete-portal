<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dual Performance Portal</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 20px;
}

.container {
  max-width: 600px;
  margin: auto;
}

.exercise {
  background: #1e293b;
  padding: 15px;
  margin-bottom: 10px;
  border-radius: 10px;
}

.exercise h3 {
  margin: 0 0 5px 0;
}

.exercise p {
  margin: 0;
  font-size: 14px;
  color: #cbd5f5;
}

.exercise small {
  display: block;
  margin-top: 5px;
  color: #94a3b8;
}
</style>
</head>

<body>

<h1>🏋️ Dual Performance</h1>

<div class="container">
  <div id="workout"></div>
</div>

<script>
const PROXY = 'https://api.allorigins.win/raw?url=';

function nKey(){ return localStorage.getItem('notion_key'); }
function nDb(){ return localStorage.getItem('notion_db'); }

async function notionReq(endpoint, body){
  const url = `https://api.notion.com/v1/${endpoint}`;
  const r = await fetch(`${PROXY}${encodeURIComponent(url)}`, {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'X-Requested-With':'XMLHttpRequest'
    },
    body: JSON.stringify({
      notion_token: nKey(),
      notion_body: body,
      notion_data: body
    })
  });
  return r.json();
}

// ================= PROGRAM =================
const STR = {

  "Upper A": [
    {"exercise":"Low Row","sets":"4","reps":"8","rest":"90s","notes":"2 warm up · 2 working"},
    {"exercise":"Close Grip Cable Row","sets":"2","reps":"8","rest":"90s","notes":"2 working"},
    {"exercise":"Pec Dec","sets":"4","reps":"8","rest":"90s","notes":"2 warm up · 2 working"},
    {"exercise":"Incline Bench","sets":"2","reps":"8","rest":"90s","notes":"2 working"},
    {"exercise":"Lat Pulldown","sets":"2","reps":"8","rest":"90s","notes":"2 working"},
    {"exercise":"Tricep Dip","sets":"2","reps":"8","rest":"90s","notes":"2 working"},
    {"exercise":"Shoulder Press","sets":"2","reps":"8","rest":"90s","notes":"2 working"},
    {"exercise":"Bicep Curl Variation","sets":"3","reps":"8","rest":"90s","notes":"3 working"},
    {"exercise":"Lateral Raise","sets":"3","reps":"10","rest":"90s","notes":"3 working"},
    {"exercise":"Tricep Rope Extension","sets":"3","reps":"8","rest":"90s","notes":"3 working"},
    {"exercise":"Rear Delt Fly","sets":"2","reps":"10","rest":"90s","notes":"2 working"},
    {"exercise":"Abdominal Crunch","sets":"3","reps":"8","rest":"90s","notes":"2–3 working"}
  ],

  "Upper B": [
    {"exercise":"Low Row","sets":"4","reps":"8","rest":"90s","notes":"2 warm up · 2 working"},
    {"exercise":"Mid Row","sets":"2","reps":"8","rest":"90s","notes":"2 working"},
    {"exercise":"Pec Dec","sets":"4","reps":"8","rest":"90s","notes":"2 warm up · 2 working"},
    {"exercise":"Incline Bench","sets":"2","reps":"8","rest":"90s","notes":"2 working"},
    {"exercise":"Lat Pulldown","sets":"2","reps":"8","rest":"90s","notes":"2 working"},
    {"exercise":"Tricep Dip","sets":"2","reps":"8","rest":"90s","notes":"2 working"},
    {"exercise":"Shoulder Press","sets":"2","reps":"8","rest":"90s","notes":"2 working"},
    {"exercise":"Bicep Curl Variation","sets":"3","reps":"8","rest":"90s","notes":"3 working"},
    {"exercise":"Lateral Raise","sets":"3","reps":"10","rest":"90s","notes":"3 working"},
    {"exercise":"Tricep Rope Extension","sets":"3","reps":"8","rest":"90s","notes":"3 working"},
    {"exercise":"Rear Delt Fly","sets":"2","reps":"10","rest":"90s","notes":"2 working"},
    {"exercise":"Abdominal Crunch","sets":"3","reps":"8","rest":"90s","notes":"2–3 working"}
  ],

  "Lower A": [
    {"exercise":"Quad Extension","sets":"5","reps":"8","rest":"90s","notes":"2 warm up · 3 working"},
    {"exercise":"Split Squat","sets":"3","reps":"8","rest":"90s","notes":"3 working"},
    {"exercise":"Hamstring Curl","sets":"5","reps":"8","rest":"90s","notes":"2 warm up · 3 working"},
    {"exercise":"RDL Variation","sets":"3","reps":"8","rest":"90s","notes":"3 working"},
    {"exercise":"Adductors","sets":"2","reps":"8","rest":"90s","notes":"2 working"},
    {"exercise":"Standing Calf Raise","sets":"3","reps":"8","rest":"90s","notes":"3 working"},
    {"exercise":"Abdominal Crunch","sets":"3","reps":"8","rest":"90s","notes":"2–3 working"}
  ],

  "Lower B": [
    {"exercise":"Leg Press","sets":"4","reps":"8","rest":"120s","notes":"2 warm up · 2 working"},
    {"exercise":"Hamstring Curl","sets":"5","reps":"8","rest":"90s","notes":"2 warm up · 3 working"},
    {"exercise":"Step Downs","sets":"5","reps":"8","rest":"90s","notes":"2 warm up · 3 working"},
    {"exercise":"Hip Flexors","sets":"3","reps":"8","rest":"90s","notes":"3 working"},
    {"exercise":"Tibialis Raise","sets":"2","reps":"10","rest":"90s","notes":"2 working"},
    {"exercise":"Seated Calf Raise","sets":"3","reps":"8","rest":"90s","notes":"3 working"},
    {"exercise":"Abdominal Crunch","sets":"3","reps":"8","rest":"90s","notes":"2–3 working"}
  ]
};

// ================= RENDER =================
function renderSession(split){
  const container = document.getElementById("workout");
  container.innerHTML = "";

  const workout = STR[split] || STR["Upper A"];

  workout.forEach(ex => {
    const div = document.createElement("div");
    div.className = "exercise";

    div.innerHTML = `
      <h3>${ex.exercise}</h3>
      <p>Sets: ${ex.sets} | Reps: ${ex.reps} | Rest: ${ex.rest}</p>
      <small>${ex.notes}</small>
    `;

    container.appendChild(div);
  });
}

// ================= LOAD FROM NOTION =================
async function load(){
  try {
    const data = await notionReq(`databases/${nDb()}/query`, {});
    const sessions = data.results || [];

    const today = new Date().toISOString().split("T")[0];

    const s = sessions.find(x => {
      return x.properties?.Date?.date?.start === today;
    });

    const GYM_KEYS = ["Upper A","Upper B","Lower A","Lower B"];

    const splitKey = GYM_KEYS.find(k =>
      (s?.properties?.Name?.title?.[0]?.plain_text || "").includes(k)
    ) || "Upper A";

    renderSession(splitKey);

  } catch (err) {
    console.error(err);
    renderSession("Upper A");
  }
}

load();
</script>

</body>
</html>
