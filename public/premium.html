<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dual Performance Portal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0b0a}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
#strava-btn{
  position:fixed;bottom:20px;right:20px;z-index:100;
  display:inline-flex;align-items:center;gap:8px;
  background:#fc4c02;color:#fff;
  font-family:ui-monospace,monospace;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;
  padding:10px 16px;border-radius:999px;
  text-decoration:none;border:none;cursor:pointer;
  box-shadow:0 4px 16px rgba(252,76,2,.4);
  transition:opacity .15s;
}
#strava-btn:hover{opacity:.85}
#strava-btn.connected{background:#16803c;box-shadow:0 4px 16px rgba(22,128,60,.3);pointer-events:none}
</style>
</head>
<body>
<iframe id="portalFrame" title="Dual Performance athlete portal"></iframe>
<a id="strava-btn" href="#" target="_blank" rel="noopener">
  <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
    <path d="M15.387 17.944l-2.089-4.116h-3.065L15.387 24l5.15-10.172h-3.066z"/>
    <path d="M11.234 13.828L7.07 6h5.886l4.143 7.828z" opacity=".7"/>
  </svg>
  Connect Strava
</a>
<script>
(function(){
  var frame = document.getElementById('portalFrame');
  var btn   = document.getElementById('strava-btn');

  frame.src = '/index.html' + window.location.search;

  function athleteCode() {
    return new URLSearchParams(location.search).get('code') || '';
  }

  function connectUrl(code) {
    return 'https://www.strava.com/oauth/authorize' +
      '?client_id=254938' +
      '&response_type=code' +
      '&redirect_uri=' + encodeURIComponent(window.location.origin + '/api/strava-callback') +
      '&scope=activity:read_all' +
      '&state=' + encodeURIComponent(code);
  }

  async function init() {
    var code = athleteCode();
    if (!code) { btn.href = '#'; return; }

    try {
      var res  = await fetch('/api/strava?athlete=' + encodeURIComponent(code));
      var data = await res.json();
      if (data.connected) {
        btn.textContent = '✓ Strava connected';
        btn.classList.add('connected');
      } else {
        btn.href = data.connectUrl || connectUrl(code);
      }
    } catch(e) {
      btn.href = connectUrl(code);
    }
  }

  init();
})();
</script>
</body>
</html>
